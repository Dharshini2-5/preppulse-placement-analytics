spring.application.name=preppulse-analytics
server.port=8081

# Default embedded H2 in MySQL compatibility mode (persists to ./data/placementdb.mv.db)
# Activate real MySQL 8 with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/placementdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration (HS256 - Base64 encoded 256+ bit secret)
app.jwt.secret=UHJlcFB1bHNlQW5hbHl0aWNzU2VjdXJlSldUU2VjcmV0S2V5MjAyNkFubmFVbml2ZXJzaXR5RFNB
app.jwt.expiration-ms=86400000

# CORS allowed origins
app.cors.allowed-origins=http://localhost:5171,http://127.0.0.1:5171

# Active database label for telemetry
app.database.mode=H2 (MySQL-Compatible Persistent Mode)
